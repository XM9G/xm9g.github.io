</style></head><body>
<h1>🎧 Maloja Fun Stats</h1>
<p class="sub">Drop your Maloja export JSON below. Everything is computed in your browser; nothing is uploaded.</p>
<div id="st" class="sub">Loading your scrobbles from maljoa.xm9g.net…</div><div id="drop" style="display:none"><b>Drop maloja_export.json here</b><br><span class="btn">Choose file</span><input id="f" type="file" accept=".json" hidden></div>
<div id="out"></div><div id="tip"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const drop=$('#drop'),inp=$('#f');
drop.onclick=()=>inp.click();
inp.onchange=()=>inp.files[0]&&load(inp.files[0]);
drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');e.dataTransfer.files[0]&&load(e.dataTransfer.files[0])};
function load(file){const r=new FileReader();r.onload=()=>{try{run(JSON.parse(r.result))}catch(e){$('#out').innerHTML='<p>That doesn’t look like valid JSON.</p>'}};r.readAsText(file)}
const SRC='https://maljoa.xm9g.net/apis/mlj_1/scrobbles';
setTimeout(async()=>{const st=$('#st');
 try{const all=[],PP=1000;let prevFirst=null;
  for(let pg=0;pg<200;pg++){const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);const res=await fetch(SRC+'?perpage='+PP+'&page='+pg,{signal:c.signal});clearTimeout(t);
  if(!res.ok)throw new Error('HTTP '+res.status);const d=await res.json(),list=Array.isArray(d)?d:(d.list||d.scrobbles||[]);if(!list.length||list[0].time===prevFirst)break;prevFirst=list[0].time;all.push(...list);st.textContent='Loading scrobbles from maljoa.xm9g.net… '+all.length.toLocaleString();if(list.length<PP)break}if(!all.length)throw new Error('empty');
  st.remove();run({scrobbles:all});
 }catch(e){st.innerHTML='Couldn’t load scrobbles from maljoa.xm9g.net (it may be blocked by CORS, login or this page’s security policy). Upload your export instead.';drop.style.display=''}
},0);
for(let i=0;i<14;i++){const b=document.createElement('span'),s=14+Math.random()*50;b.className='bub';b.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${14+Math.random()*16}s;animation-delay:${-Math.random()*20}s`;document.body.appendChild(b)}
const tip=$('#tip');
function showTip(t,x,y){tip.textContent=t;tip.style.display='block';const w=tip.offsetWidth;tip.style.left=Math.max(4,Math.min(innerWidth-w-4,x+12))+'px';const h=tip.offsetHeight;tip.style.top=(y-h-14<4?y+18:y-h-14)+'px'}
function tipEvt(e){const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el.dataset.tip,e.clientX,e.clientY);else tip.style.display='none'}
document.addEventListener('pointermove',tipEvt);document.addEventListener('pointerdown',tipEvt);
const PAL=['#6366f1','#22d3ee','#f472b6','#fbbf24','#34d399','#a78bfa','#fb923c','#94a3b8'],PIES=[];
function pie(items){items=items.filter(x=>x[1]>0);const tot=items.reduce((a,x)=>a+x[1],0)||1;let acc=0;
 const g=items.map((x,i)=>{const a=acc/tot*100;acc+=x[1];return `${x[0]==='Everything else'?'#8aa0b5':PAL[i%PAL.length]} ${a}% ${acc/tot*100}%`}).join(',');
 PIES.push(items.map(x=>[x[0],x[1],x[1]/tot*100]));
 return `<div class="dl"><div class="donut pie" data-pi="${PIES.length-1}" style="background:conic-gradient(${g})"></div><div class="lg">${items.map((x,i)=>`<div class="fact" title="${esc(x[0])}: ${x[1].toLocaleString()} (${(x[1]/tot*100).toFixed(1)}%)"><span style="color:${x[0]==='Everything else'?'#8aa0b5':PAL[i%PAL.length]}">●</span> ${esc(x[0])} <b>${(x[1]/tot*100).toFixed(0)}%</b> <span class="sub">${x[1].toLocaleString()}</span></div>`).join('')}</div></div>`}
function count(arr){const m=new Map();arr.forEach(k=>m.set(k,(m.get(k)||0)+1));return [...m].sort((a,b)=>b[1]-a[1])}
function bars(list,n=10){const mx=list[0]?list[0][1]:1;return list.slice(0,n).map(([k,v])=>`<div class="row"><span class="n" title="${esc(k)}">${esc(k)}</span><span class="b"><i style="width:${v/mx*100}%"></i></span><span class="v">${v}</span></div>`).join('')}
function col(vals,labels,tips){tips=tips||labels;const mx=Math.max(...vals,1);return `<div class="chart">${vals.map((v,i)=>`<div style="height:${v/mx*100}%;animation-delay:${i*18}ms" title="${tips[i]}: ${v} plays"></div>`).join('')}</div><div class="axis">${labels.map(l=>`<span>${l}</span>`).join('')}</div>`}
function run(d){
  const S=(d.scrobbles||(Array.isArray(d)?d:[])).filter(s=>s&&s.time&&s.track).sort((a,b)=>a.time-b.time);
  if(!S.length){$('#out').innerHTML='<p>No scrobbles found.</p>';return}
  const dt=s=>new Date(s.time*1000);
  const artists=[],tracks=[],albums=[],origins=[];
  S.forEach(s=>{const t=s.track;(t.artists||[]).forEach(a=>artists.push(a));tracks.push((t.artists||[]).join(', ')+' – '+t.title);
    if(t.album&&t.album.albumtitle)albums.push(t.album.albumtitle);origins.push((s.origin||'unknown').replace('client:',''))});
  const hours=Array(24).fill(0),wd=Array(7).fill(0),days=new Map(),months=new Map();
  S.forEach(s=>{const x=dt(s);hours[x.getHours()]++;wd[(x.getDay()+6)%7]++;
    const dk=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');

   gap.oninput=draw;so.onchange=draw;sl.onclick=e=>{const r=e.target.closest&&e.target.closest('.srow');if(r){sel=+r.dataset.k;draw()}};draw()})();
  const rsv=$('#race'),rl=$('#rl');
  if(rsv){rsv.onpointermove=e=>{const r=rsv.getBoundingClientRect(),n=raceDays.length,i=n>1?Math.round(Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*(n-1)):0,x=n>1?i/(n-1)*600:0;rl.setAttribute('x1',x);rl.setAttribute('x2',x);rl.setAttribute('opacity',1);rsv.dataset.tip=raceDays[i]+'\n'+raceNames.map((a,k)=>'● '+cut(a,26)+': '+raceCum[k][i]).join('\n')};rsv.onpointerleave=()=>{rl.setAttribute('opacity',0);delete rsv.dataset.tip}}
  const sv=$('#cc'),cl=$('#cl');
  sv.onpointermove=e=>{const r=sv.getBoundingClientRect(),n=pts.length,i=n>1?Math.round(Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*(n-1)):0,d=new Date(d0);d.setDate(d.getDate()+i);
   cl.setAttribute('x1',n>1?i/(n-1)*600:0);cl.setAttribute('x2',n>1?i/(n-1)*600:0);cl.setAttribute('opacity',1);
   sv.dataset.tip=fd(d)+': '+pts[i].toLocaleString()+' total (+'+(pts[i]-(i?pts[i-1]:0))+' that day)'};

  document.querySelectorAll('#out .pie').forEach(el=>{el.onpointermove=e=>{const r=el.getBoundingClientRect();let a=Math.atan2(e.clientX-(r.left+r.width/2),-(e.clientY-(r.top+r.height/2)))/(2*Math.PI);if(a<0)a+=1;let acc=0;for(const it of PIES[el.dataset.pi]){acc+=it[2]/100;if(a<=acc){el.dataset.tip=it[0]+': '+it[1].toLocaleString()+' ('+it[2].toFixed(1)+'%)';return}}}});
  document.querySelectorAll('#out .cal i').forEach((c,i)=>c.style.animationDelay=(600+i*6)+'ms');

   const step=t=>{const f=Math.min(1,(t-t0)/1000),e=1-Math.pow(1-f,3);el.textContent=m[1]+(to*e).toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:dec})+m[3];if(f<1)requestAnimationFrame(step)};requestAnimationFrame(step)});
